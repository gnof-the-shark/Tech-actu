<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>ACSM → ePub/PDF (100% navigateur)</title>
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body class="min-h-screen bg-slate-950 text-slate-100">
    <main class="mx-auto max-w-4xl px-4 py-10 sm:px-6 lg:px-8">
      <header class="mb-8">
        <h1 class="text-3xl font-bold tracking-tight sm:text-4xl">Convertisseur ACSM → ePub/PDF</h1>
        <p class="mt-3 text-slate-300">
          Outil local sans serveur: le fichier est traité dans votre navigateur.
        </p>
        <p class="mt-2 text-sm text-amber-300">
          Limite: la plupart des fichiers ACSM Adobe DRM nécessitent une authentification/licence externe.
        </p>
      </header>

      <section class="rounded-2xl border border-slate-800 bg-slate-900/70 p-5 shadow-lg shadow-slate-950/40">
        <label for="acsmInput" class="mb-3 block text-sm font-medium text-slate-200">Fichier .acsm</label>
        <input
          id="acsmInput"
          type="file"
          accept=".acsm,application/vnd.adobe.adept+xml,text/xml,application/xml"
          class="block w-full rounded-lg border border-slate-700 bg-slate-950 px-3 py-2 text-sm text-slate-100 file:mr-4 file:rounded-md file:border-0 file:bg-cyan-500 file:px-3 file:py-2 file:text-sm file:font-semibold file:text-slate-950 hover:file:bg-cyan-400"
        />

        <div class="mt-5 flex flex-wrap gap-3">
          <button
            id="downloadBtn"
            type="button"
            class="rounded-lg bg-cyan-500 px-4 py-2 text-sm font-semibold text-slate-950 transition hover:bg-cyan-400 disabled:cursor-not-allowed disabled:opacity-50"
            disabled
          >
            Tenter téléchargement ePub/PDF
          </button>
          <button
            id="exportBtn"
            type="button"
            class="rounded-lg border border-slate-600 px-4 py-2 text-sm font-semibold text-slate-100 transition hover:border-slate-500 hover:bg-slate-800 disabled:cursor-not-allowed disabled:opacity-50"
            disabled
          >
            Exporter les infos
          </button>
        </div>
      </section>

      <section id="result" class="mt-6 hidden rounded-2xl border border-slate-800 bg-slate-900/70 p-5"></section>
      <div id="status" class="mt-6 hidden rounded-xl border p-4 text-sm"></div>
    </main>

    <script>
      const acsmInput = document.getElementById("acsmInput");
      const resultEl = document.getElementById("result");
      const statusEl = document.getElementById("status");
      const downloadBtn = document.getElementById("downloadBtn");
      const exportBtn = document.getElementById("exportBtn");

      let parsedData = null;

      function setStatus(message, level = "info") {
        const palettes = {
          info: "border-cyan-500/40 bg-cyan-500/10 text-cyan-100",
          warn: "border-amber-500/40 bg-amber-500/10 text-amber-100",
          error: "border-red-500/40 bg-red-500/10 text-red-100",
          success: "border-emerald-500/40 bg-emerald-500/10 text-emerald-100",
        };

        statusEl.className = `mt-6 rounded-xl border p-4 text-sm ${palettes[level] || palettes.info}`;
        statusEl.textContent = message;
        statusEl.classList.remove("hidden");
      }

      function getFirstByLocalName(doc, localName) {
        const all = doc.getElementsByTagName("*");
        for (const node of all) {
          if (node.localName === localName && node.textContent) {
            const text = node.textContent.trim();
            if (text) return text;
          }
        }
        return "";
      }

      function listUrlsInDocument(doc, xmlText) {
        const urls = new Set();
        const all = doc.getElementsByTagName("*");
        for (const node of all) {
          const text = (node.textContent || "").trim();
          if (/^https?:\/\//i.test(text)) urls.add(text);
        }

        const regex = /https?:\/\/[^\s"'<>]+/gi;
        for (const url of xmlText.match(regex) || []) urls.add(url);

        return Array.from(urls);
      }

      function parseAcsm(xmlText) {
        const parser = new DOMParser();
        const doc = parser.parseFromString(xmlText, "application/xml");

        if (doc.querySelector("parsererror")) {
          throw new Error("Le fichier ACSM est invalide ou corrompu.");
        }

        const title = getFirstByLocalName(doc, "title") || "Titre indisponible";
        const author = getFirstByLocalName(doc, "creator") || "Auteur indisponible";
        const publisher = getFirstByLocalName(doc, "publisher") || "Éditeur indisponible";
        const language = getFirstByLocalName(doc, "language") || "Langue indisponible";
        const issued = getFirstByLocalName(doc, "issued") || "Date indisponible";

        const urls = listUrlsInDocument(doc, xmlText);
        const fulfillmentUrl =
          urls.find((url) => /fulfill|acsm|adept|download/i.test(url)) ||
          urls.find((url) => /^https?:\/\//i.test(url)) ||
          "";

        return {
          title,
          author,
          publisher,
          language,
          issued,
          fulfillmentUrl,
          urls,
        };
      }

      function renderResult(data) {
        resultEl.innerHTML = "";

        const title = document.createElement("h2");
        title.className = "text-xl font-semibold text-white";
        title.textContent = data.title;

        const list = document.createElement("dl");
        list.className = "mt-4 grid grid-cols-1 gap-3 text-sm sm:grid-cols-2";

        const fields = [
          ["Auteur", data.author],
          ["Éditeur", data.publisher],
          ["Langue", data.language],
          ["Date", data.issued],
          ["URL trouvée", data.fulfillmentUrl || "Aucune URL trouvée"],
        ];

        for (const [label, value] of fields) {
          const row = document.createElement("div");
          row.className = "rounded-lg border border-slate-800 bg-slate-950/70 p-3";

          const dt = document.createElement("dt");
          dt.className = "text-xs uppercase tracking-wide text-cyan-300";
          dt.textContent = label;

          const dd = document.createElement("dd");
          dd.className = "mt-1 break-all text-slate-200";
          dd.textContent = value;

          row.appendChild(dt);
          row.appendChild(dd);
          list.appendChild(row);
        }

        resultEl.appendChild(title);
        resultEl.appendChild(list);
        resultEl.classList.remove("hidden");
      }

      function downloadBlob(blob, filename) {
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        document.body.appendChild(link);
        link.click();
        link.remove();
        URL.revokeObjectURL(url);
      }

      function extensionFromResponse(response, blob) {
        const ct = (response.headers.get("content-type") || "").toLowerCase();
        if (ct.includes("application/pdf")) return "pdf";
        if (ct.includes("epub") || ct.includes("application/zip")) return "epub";

        if (blob.size >= 4) {
          return blob.slice(0, 4).text().then((head) => (head === "%PDF" ? "pdf" : "epub"));
        }

        return Promise.resolve("bin");
      }

      async function tryDownloadFile() {
        if (!parsedData || !parsedData.fulfillmentUrl) {
          setStatus("Aucune URL exploitable détectée dans le fichier ACSM.", "warn");
          return;
        }

        setStatus("Tentative de récupération en cours...", "info");

        try {
          const response = await fetch(parsedData.fulfillmentUrl, { method: "GET" });
          if (!response.ok) throw new Error(`HTTP ${response.status}`);

          const blob = await response.blob();
          const ext = await extensionFromResponse(response, blob);
          const safeBaseName = (parsedData.title || "ebook")
            .normalize("NFD")
            .replace(/[\u0300-\u036f]/g, "")
            .replace(/[^a-zA-Z0-9-_]+/g, "-")
            .replace(/^-+|-+$/g, "")
            .toLowerCase() || "ebook";

          const finalExt = ext === "pdf" || ext === "epub" ? ext : "bin";
          downloadBlob(blob, `${safeBaseName}.${finalExt}`);

          if (finalExt === "bin") {
            setStatus("Téléchargement effectué, mais le format n’a pas pu être identifié automatiquement.", "warn");
            return;
          }

          setStatus(`Téléchargement réussi (${finalExt.toUpperCase()}).`, "success");
        } catch (error) {
          setStatus(
            `Échec du téléchargement (${error.message}). Si le fichier est protégé DRM, une app Adobe est généralement requise.`,
            "error",
          );
        }
      }

      function exportMetadata() {
        if (!parsedData) return;
        const payload = {
          extracted_at: new Date().toISOString(),
          ...parsedData,
        };
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json;charset=utf-8" });
        downloadBlob(blob, "acsm-metadata.json");
      }

      acsmInput.addEventListener("change", async (event) => {
        const file = event.target.files?.[0];
        parsedData = null;
        downloadBtn.disabled = true;
        exportBtn.disabled = true;
        resultEl.classList.add("hidden");
        statusEl.classList.add("hidden");

        if (!file) return;

        try {
          const text = await file.text();
          parsedData = parseAcsm(text);
          renderResult(parsedData);

          downloadBtn.disabled = !parsedData.fulfillmentUrl;
          exportBtn.disabled = false;

          if (!parsedData.fulfillmentUrl) {
            setStatus("Le fichier a été lu, mais aucune URL de récupération n’a été trouvée.", "warn");
          } else {
            setStatus("Fichier ACSM chargé. Vous pouvez tenter le téléchargement ePub/PDF.", "success");
          }
        } catch (error) {
          setStatus(error.message || "Impossible de lire ce fichier ACSM.", "error");
        }
      });

      downloadBtn.addEventListener("click", tryDownloadFile);
      exportBtn.addEventListener("click", exportMetadata);
    </script>
  </body>
</html>
